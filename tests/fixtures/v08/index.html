<title>v0.8</title>
<style>
  body { font: 16px/1.6 sans-serif; margin: 24px; }

  p { margin: 0; }
</style>
</head>
<body>
<div class="grid" id="grid">
  <div class="blk" id="b1"><span class="lbl">一</span><p>第一块正文</p></div>
  <div class="blk" id="b2"><span class="lbl">二</span><p>第二块正文</p></div>
  <div class="blk" id="b3"><span class="lbl">三</span><p>第三块正文</p></div>
  <div class="blk" id="b4"><span class="lbl">四</span><p>第四块正文</p></div>
</div>

</html>
