<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Habitly — 习惯养成 App</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-50">
<header class="container mx-auto flex justify-between px-6 py-6">
  <a href="#" class="text-2xl font-extrabold text-emerald-600">Habitly</a>
  <button class="rounded-full bg-emerald-600 px-6 py-2 text-white">下载 App</button>
</header>
<main class="container mx-auto px-6">
  <section class="py-16">
    <p class="inline-block rounded-full bg-emerald-100 px-4 py-1 text-sm">🎉 App Store 健康类第一名</p>
    <h1 class="mt-6 text-5xl font-extrabold">21 天，<span class="text-emerald-600">养成一个好习惯</span></h1>
    <p class="mt-6 text-lg text-gray-600">Habitly 用科学的打卡节奏和温和的提醒，帮你把“想做”变成“每天都在做”。</p>
    <a href="#" class="rounded-xl bg-black px-5 py-3 text-white">App Store 下载</a>
    <a href="#" class="rounded-xl bg-black px-5 py-3 text-white">Google Play 下载</a>
    <ul class="mt-8 space-y-3">
      <li>💧 喝 8 杯水 <span class="text-emerald-600">6/8</span></li>
      <li>📖 阅读 20 分钟 <span class="text-amber-600">✓</span></li>
      <li>🏃 跑步 3 公里 <span class="text-sky-600">0/3</span></li>
    </ul>
  </section>
  <section class="py-16">
    <h2 class="text-center text-3xl font-bold">用户怎么说</h2>
    <div class="mt-10 grid gap-6 md:grid-cols-3">
      <figure class="rounded-2xl bg-white p-6"><blockquote><p>“坚持早起 60 天了，这是我第一次真正做到。”</p></blockquote><figcaption>— 王同学，研究生</figcaption></figure>
      <figure class="rounded-2xl bg-white p-6"><blockquote><p>“提醒不烦人，统计图很好看，忍不住每天打开。”</p></blockquote><figcaption>— Lily，设计师</figcaption></figure>
      <figure class="rounded-2xl bg-white p-6"><blockquote><p>“和家人一起组队打卡，孩子也爱上了阅读。”</p></blockquote><figcaption>— 陈女士，两个孩子的妈妈</figcaption></figure>
    </div>
  </section>
</main>
<footer class="py-8 text-center text-sm text-gray-500"><p>Habitly © 2026 · <a href="#">隐私政策</a> · <a href="#">用户协议</a></p></footer>
</body>
</html>
