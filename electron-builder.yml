appId: com.twiq.app
productName: Twiq
copyright: © 2026 Roger Luo
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/sample-demo.html
    to: sample-demo.html
  - from: resources/sample-demo.en.html
    to: sample-demo.en.html
  - from: THIRD_PARTY_LICENSES.md
    to: THIRD_PARTY_LICENSES.md
asarUnpack: []
fileAssociations:
  - ext: [html, htm]
    name: HTML 文档
    description: HTML 文档
    role: Editor
    rank: Alternate
    mimeType: text/html
mac:
  category: public.app-category.productivity
  # Windows 包由 electron-builder 自动带上 Electron 与 Chromium 的许可证；macOS 不会，这里显式放进 Resources（v0.10）
  extraResources:
    - from: node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 没有 Developer ID 证书时做 ad-hoc 签名。identity: null 会跳过签名，打包时又改动了 Electron
  # 原有的签名，下载后在 Apple 芯片上会被报「已损坏」；ad-hoc 签名后只提示无法验证开发者，
  # 用户在「系统设置 › 隐私与安全性」里放行即可。公证需要 Developer ID
  identity: '-'
  hardenedRuntime: false
dmg:
  title: Twiq ${version}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
nsis:
  # 默认名「Twiq Setup x.y.z.exe」带空格，上传到 GitHub Release 后空格会变成点；README 按这个名字写
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
