<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Twiq 应用图标「微调旋钮」· 铝灰 + 信号橙。
       一颗带刻度的旋钮，指针是 </> 里的那根斜线：tweak（微调）+ HTML。
       macOS 网格：画布 1024，圆角方 824 居中（左右各留 100），圆角 184.3。
       导出：npx electron scripts/render-icon.cjs && iconutil -c icns build/icon.iconset -o build/icon.icns -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184.3"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECE9E4"/><stop offset="1" stop-color="#C9C4BC"/></linearGradient>
    <radialGradient id="face" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FAFAF8"/><stop offset="1" stop-color="#DCD8D1"/></radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".22"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <g clip-path="url(#tile)">
    <g transform="translate(100 100) scale(0.8046875)">
      <rect width="1024" height="1024" fill="url(#bg)"/>
