49.0" stroke="#6B6A66" stroke-width="12" stroke-linecap="round"/><line x1="782.3" y1="322.7" x2="803.6" y2="307.8" stroke="#6B6A66" stroke-width="7" stroke-linecap="round"/><line x1="811.1" y1="372.5" x2="834.6" y2="361.5" stroke="#6B6A66" stroke-width="7" stroke-linecap="round"/><line x1="830.8" y1="426.6" x2="871.3" y2="415.7" stroke="#6B6A66" stroke-width="12" stroke-linecap="round"/><line x1="840.7" y1="483.2" x2="866.6" y2="481.0" stroke="#6B6A66" stroke-width="7" stroke-linecap="round"/><line x1="840.7" y1="540.8" x2="866.6" y2="543.0" stroke="#6B6A66" stroke-width="7" stroke-linecap="round"/><line x1="830.8" y1="597.4" x2="871.3" y2="608.3" stroke="#6B6A66" stroke-width="12" stroke-linecap="round"/><line x1="811.1" y1="651.5" x2="834.6" y2="662.5" stroke="#6B6A66" stroke-width="7" stroke-linecap="round"/><line x1="782.3" y1="701.3" x2="803.6" y2="716.2" stroke="#6B6A66" stroke-width="7" stroke-linecap="round"/><line x1="745.3" y1="745.3" x2="775.0" y2="775.0" stroke="#6B6A66" stroke-width="12" stroke-linecap="round"/>
      <circle cx="512" cy="512" r="282" fill="url(#face)" filter="url(#drop)"/>
      <circle cx="512" cy="512" r="282" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="4"/>
      <path d="M436 438 L382 512 L436 586 M588 438 L642 512 L588 586" fill="none" stroke="#6B6A66" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M570 330 L486 600" fill="none" stroke="#FF5A1F" stroke-width="40" stroke-linecap="round"/>
      <rect width="1024" height="1024" filter="url(#grain)" opacity=".18" style="mix-blend-mode:overlay"/>
    </g>
    <rect x="100.5" y="100.5" width="823" height="823" rx="184" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="1"/>
  </g>
</svg>
